name: Cron Action
on:
  workflow_dispatch:
  # Daily scheduled runs are currently disabled.
  # To resume, uncomment the schedule block below.
  # schedule:
  #   # Asia/Shanghai 06:00, 10:00, 14:00, 17:00, 20:00
  #   # UTC 22:00, 02:00, 06:00, 09:00, 12:00
  #   - cron: '0 22,2,6,9,12 * * *'

permissions:
  contents: write

concurrency:
  group: rss2telegram-history
  cancel-in-progress: false

jobs:
  rss2telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.0
      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --with pytest pytest
      - name: Verify CLI entry point
        run: uv run rss2telegram --help
      - name: Create personal config
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DESTINATIONS: ${{ secrets.DESTINATIONS }}
          TOPIC: ${{ secrets.TOPIC }}
          OPML_FILE: ${{ secrets.OPML_FILE }}
          DATABASE: ${{ secrets.DATABASE }}
          MAX_ENTRIES_PER_FEED: ${{ secrets.MAX_ENTRIES_PER_FEED }}
          SEND_ON_FIRST_RUN: ${{ secrets.SEND_ON_FIRST_RUN }}
          SLEEP_BETWEEN_MESSAGES: ${{ secrets.SLEEP_BETWEEN_MESSAGES }}
        run: |
          uv run python - <<'PY'
          import os

          keys = [
              "BOT_TOKEN",
              "DESTINATIONS",
              "TOPIC",
              "OPML_FILE",
              "DATABASE",
              "MAX_ENTRIES_PER_FEED",
              "SEND_ON_FIRST_RUN",
              "SLEEP_BETWEEN_MESSAGES",
          ]

          with open(".env", "w", encoding="utf-8") as handle:
              for key in keys:
                  handle.write(f"{key}={os.environ.get(key, '')}\n")
          PY
      - name: Run Rss to Telegram
        run: uv run rss2telegram
      - name: Commit history database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss2telegram.db
          if git diff --cached --quiet; then
            echo "No database changes to commit"
          else
            git commit -m "chore(db): 更新 RSS 历史哈希库"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Push attempt ${attempt} failed; retrying after 5s"
              sleep 5
            done
            test "${pushed}" = "1" || { echo "Failed to push history database after 3 attempts"; exit 1; }
          fi
      - name: Upload history
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rss2telegram
          path: rss2telegram.db
          if-no-files-found: error
