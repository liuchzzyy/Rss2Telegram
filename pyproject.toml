[project]
name = "rss2telegram-opml"
version = "0.1.0"
description = "Send RSS/Atom entries from an OPML subscription file to Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11,<7",
    "httpx>=0.27",
    "pyTelegramBotAPI>=4.23,<5",
]

[project.scripts]
rss2telegram = "rss2tg.runner:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
